name: Release

# Signed release builds. Tag a commit (`git tag v1.3.1 && git push --tags`) and
# this produces:
#   * app-release.aab — the App Bundle you upload to the Play Console
#   * app-release.apk — the same build as a sideloadable APK, attached to the
#     GitHub Release so testers can install without a cable
# Both are signed with the *upload* key held in the AVA_KEYSTORE_BASE64 secret.
# Under Play App Signing this is not the key users' devices see, so it can be
# reset through the Play Console if it is ever lost — but back it up anyway.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to create the GitHub Release and attach the APK

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Same pinning as android-build.yml: :whisper_native requires cmake 3.22.1
      # and no ndkVersion is declared, so install AGP's default explicitly.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # Play rejects an upload whose versionCode it has already seen, and a tag
      # that disagrees with versionName makes the release history unreadable.
      # Catch both before spending ten minutes on a native build.
      - name: Check version metadata
        run: |
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          echo "versionName=$VERSION_NAME versionCode=$VERSION_CODE"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$VERSION_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $VERSION_NAME in app/build.gradle.kts. Bump versionName (and versionCode) or retag."
              exit 1
            fi
          fi

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AVA_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret AVA_KEYSTORE_BASE64 is not set. See docs/RELEASING.md."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ava-upload.jks"
          echo "AVA_KEYSTORE_FILE=$RUNNER_TEMP/ava-upload.jks" >> "$GITHUB_ENV"

      - name: Build signed bundle and APK
        env:
          AVA_KEYSTORE_PASSWORD: ${{ secrets.AVA_KEYSTORE_PASSWORD }}
          AVA_KEY_ALIAS: ${{ secrets.AVA_KEY_ALIAS }}
          AVA_KEY_PASSWORD: ${{ secrets.AVA_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      # An unsigned artifact still builds (the signingConfig is optional by
      # design) so it would sail through unnoticed. Assert it is actually signed.
      - name: Verify the APK is signed
        run: |
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk

      - name: Delete keystore from runner
        if: always()
        run: rm -f "$RUNNER_TEMP/ava-upload.jks"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ava-release-${{ env.VERSION_NAME }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/
          if-no-files-found: error

      # The GitHub Release is the sideload/OTA channel until Play internal
      # testing is live — testers install the attached APK straight from a link.
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "AVA $VERSION_NAME" \
            --notes "AVA $VERSION_NAME (versionCode $VERSION_CODE)

          \`app-release.apk\` — install directly on a phone (Unknown Sources must be allowed).
          \`app-release.aab\` — upload this one to the Play Console.

          Reminder: after installing over a previous build, re-enable AVA's Accessibility service in system settings, or Viber auto-call stops working." \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/bundle/release/app-release.aab

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-reports
          path: |
            app/build/reports/
            whisper_native/build/reports/
          if-no-files-found: ignore
