name: Android Build

# Builds AVA on GitHub's runners so the heavy toolchain (NDK, CMake, Maven deps)
# never has to be downloaded locally. Originally necessary — the online-recognition
# feature was written on a machine with no JDK installed. The local toolchain works
# now, so this is kept as a dogfooding check on every push.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # :whisper_native pins cmake_minimum_required(VERSION 3.22.1) and declares
      # externalNativeBuild, so both must be present before any native task runs.
      # No ndkVersion is pinned in whisper_native/build.gradle, so AGP picks its
      # default — install it explicitly rather than relying on the runner image.
      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      # Fast fail: this is the step that actually validates the never-compiled
      # online-recognition code in RecordingService.kt / MainActivity.kt.
      - name: Compile Kotlin
        run: ./gradlew :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ava-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
            whisper_native/build/reports/
          if-no-files-found: ignore
